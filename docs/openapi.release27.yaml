openapi: 3.1.0
info:
  title: DomiDex Release 27 — private write boundaries and sync time anchor
  version: 27-source-contract-draft
  description: >-
    Internal source contract for upload, binder-sharing, tester grants and the
    private sync time anchor; not a new public UI or client integration.
    This is a scoped subset, not a complete API catalogue or proof of deployment.
    Write rate limiting defaults to monitor; its HTTP 429 requires explicit
    DOMIDEX_WRITE_RATE_LIMIT_MODE=enforce. The new private sync-anchor read budget
    is separately always enforced, independent of that write setting.
    Optional App Check observation defaults to off and never changes authorization
    or otherwise legitimate responses in this stage.
servers:
  - url: https://domidex.web.app
security:
  - firebaseBearer: []
paths:
  /api/private-sync/time-anchor:
    get:
      operationId: readPrivateSyncTimeAnchor
      summary: Obtain the authenticated owner's exact server-time fence
      x-internal: true
      parameters:
        - { $ref: '#/components/parameters/AppCheckHeader' }
      description: >-
        Local Release-27 source contract; Android is not wired to this endpoint
        and this document does not establish deployment. Requires the unchanged
        current app/admin authorization: revocation-checked Firebase ID token,
        live user claims, accountAccess checks and no account-deletion lock.
        No query parameters or client-supplied owner/timestamp are accepted.
        The owner comes exclusively from authentication. seconds/nanoseconds
        preserve the existing authorization deletion-lock snapshot's Firestore
        readTime, including when that document is absent. This is a time fence,
        not proof of a collection snapshot, document existence, updatedAt validity
        or completion of a sync. It is not replaced by the later quota timestamp.
        After authorization and timestamp validation, a separate always-enforced
        budget admits at most 60 requests per UID per fixed 60-second server-time
        window, starting with that window's first admission. It does not limit
        ingress or authentication work and is not an anonymous/IP/token limiter.
        A transaction checks the deletion lock and updates at most one bounded
        privateReadRateLimits/syncTimeAnchor_<SHA-256(policy-NUL-UID)> document per
        UID. The document stores no raw UID; its key is still owner-derived.
        expiresAt is window end plus 24 hours: retention metadata only, with no
        TTL policy activated or timed deletion promised. Account deletion includes
        the exact own read counter without scanning other owners' counters.
        This endpoint consumes no write quota and changes no existing write
        policy or deletion behavior for write counters. Quota/storage failure
        fails closed, never to unlimited access.
      responses:
        '200':
          description: Exact authenticated owner and server timestamp; never cache
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateSyncTimeAnchor' }
        '400':
          description: Any nonempty query string is invalid; no auth or quota work
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PrivateSyncAnchorError' }
                  - properties: { error: { const: INVALID_REQUEST } }
        '401':
          description: Missing, invalid or revoked authentication; no read quota consumed
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PrivateSyncAnchorError' }
                  - properties: { error: { const: AUTH_REQUIRED } }
        '403':
          description: Disabled/unauthorized account or deletion fence, including a quota-transaction lock recheck
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PrivateSyncAnchorError' }
                  - properties: { error: { enum: [ACCESS_DENIED, ACCOUNT_DELETING] } }
        '429':
          description: Read budget exhausted; no anchor returned; explicit retry after the indicated seconds, not a sign-out
          headers:
            Retry-After:
              required: true
              schema: { type: integer, minimum: 1, maximum: 60 }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/RateLimitError' }
                  - properties: { retryAfterSeconds: { maximum: 60 } }
        '503':
          description: Missing/invalid server readTime or safe infrastructure/quota failure; no anchor or raw provider details returned
          headers:
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PrivateSyncAnchorError' }
                  - properties: { error: { const: SERVER_OPERATION_FAILED } }
  /api/pretester/scan-reports:
    post:
      operationId: uploadManualScannerReport
      summary: Upload one explicitly selected manual ScanLab report
      parameters:
        - { $ref: '#/components/parameters/AppCheckHeader' }
      description: >-
        Requires current pretester or admin access, revocation-checked Firebase
        authentication and no account-deletion lock. Upload remains voluntary;
        no automatic image release. Quota is 5 attempts per UID per 600-second
        server-time window after authorization, before reading binary data.
        Failed/malformed authenticated uploads also consume an attempt.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, report]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG or WebP; 10 MiB maximum. Entire multipart body at most 11 MiB.
                report:
                  type: string
                  description: JSON scanner report with captureType MANUAL_CAPTURE; caller cannot self-approve recognition.
      responses:
        '201':
          description: Report and image safely stored; explicit receipt
          content:
            application/json:
              schema:
                type: object
                required: [ok, reportId, reviewStatus]
                properties:
                  ok: { const: true }
                  reportId: { type: string }
                  reviewStatus: { const: NEW }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: Image or multipart body exceeds the existing size limit }
        '415': { description: Unsupported image media type }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/binder-shares:
    post:
      operationId: createBinderShare
      summary: Create an explicit read-only private-binder link
      parameters:
        - { $ref: '#/components/parameters/AppCheckHeader' }
      description: >-
        Requires current app/admin access and ownership of the non-deleted binder;
        activation gate must be enabled. Quota is 20 creations per calling UID
        per 3600-second server-time window, after body/ownership validation.
        The raw link token is returned only once; uncertain POSTs must not be
        automatically retried. Public GET viewer needs no recipient login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [binderId, confirm]
              properties:
                binderId: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
                confirm: { const: true }
                showPrices: { type: boolean, default: false }
                showTotal: { type: boolean, default: false }
                showDisplayName: { type: boolean, default: false }
                displayName: { type: string, maxLength: 60, description: Explicit non-email public name; no newlines }
      responses:
        '201':
          description: New secret link, with options; never stored as a raw token
          content:
            application/json:
              schema:
                type: object
                required: [shareId, path, createdAt, options]
                properties:
                  shareId: { type: string, pattern: '^[a-f0-9]{64}$' }
                  path: { type: string, pattern: '^/share/[A-Za-z0-9_-]{43}$' }
                  createdAt: { type: integer }
                  options: { type: object }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Disabled sharing, missing binder or foreign ownership }
        '413': { description: JSON body exceeds 2048 bytes }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: revokeBinderShare
      summary: Revoke an owned link independently of the create quota
      parameters:
        - { $ref: '#/components/parameters/AppCheckHeader' }
      description: >-
        Requires current owner app/admin access. Does not consume or depend on the
        share-creation budget, including when exhausted or misconfigured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shareId, confirm]
              properties:
                shareId: { type: string, pattern: '^[a-f0-9]{64}$' }
                confirm: { const: true }
      responses:
        '200': { description: Link revoked }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Share missing, not owned or sharing disabled }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/admin/testers:
    patch:
      operationId: changeTesterCapability
      summary: Grant or revoke exactly one existing capability
      parameters:
        - { $ref: '#/components/parameters/AppCheckHeader' }
      description: >-
        Current admin Firebase authorization is verified in both framework and
        backend; body UID is the target, never the actor. Grants (true) share a
        quota of 30 per calling admin per 60-second server-time window. Revocations
        (false) retain the leased audited flow and are independent of this quota.
        The JSON body is limited to 4096 bytes after authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uid]
              properties:
                uid: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
                appAccess: { type: boolean }
                pretester: { type: boolean }
                scannerLabAccess: { type: boolean }
              oneOf:
                - required: [appAccess]
                - required: [pretester]
                - required: [scannerLabAccess]
      responses:
        '200': { description: Updated verified user summary; tokenRefreshRequired true }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Another role-change lease owns the target }
        '413': { description: JSON body exceeds 4096 bytes }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { description: Existing generic Auth administration failure }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  headers:
    PrivateNoStore:
      required: true
      schema: { const: 'private, no-store' }
    NoSniff:
      required: true
      schema: { const: nosniff }
  parameters:
    AppCheckHeader:
      name: X-Firebase-AppCheck
      in: header
      required: false
      description: >-
        Optional independently verified Firebase App Check JWT, never a substitute
        for Authorization. Only off/monitor exist; default off. Monitor waits at
        most a 250ms timer budget after successful Auth and records fixed labels
        only. Missing/invalid/wrong-app/timeout does not reject the request.
        Verifier network work is not cancelled by the response wait budget.
      schema: { type: string, maxLength: 4096 }
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    PrivateSyncTimeAnchor:
      type: object
      required: [schemaVersion, ownerUid, seconds, nanoseconds]
      additionalProperties: false
      properties:
        schemaVersion: { type: integer, const: 1 }
        ownerUid:
          type: string
          minLength: 1
          maxLength: 128
          description: Authenticated Firebase UID; never accepted as a request parameter
        seconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 253402300799
          description: Exact Firestore readTime seconds since Unix epoch; no client-clock fallback
        nanoseconds:
          type: integer
          minimum: 0
          maximum: 999999999
          description: Exact subsecond component; no conversion through milliseconds or Date
    PrivateSyncAnchorError:
      type: object
      required: [ok, error]
      additionalProperties: false
      properties:
        ok: { const: false }
        error:
          type: string
          enum: [INVALID_REQUEST, AUTH_REQUIRED, ACCESS_DENIED, ACCOUNT_DELETING, SERVER_OPERATION_FAILED]
    Error:
      type: object
      required: [error]
      properties:
        ok: { const: false }
        error: { type: string, description: Existing safe code or localized message; no raw provider error }
    RateLimitError:
      type: object
      required: [ok, error, retryAfterSeconds]
      additionalProperties: false
      properties:
        ok: { const: false }
        error: { const: RATE_LIMITED }
        retryAfterSeconds: { type: integer, minimum: 1, maximum: 3600 }
  responses:
    InvalidRequest:
      description: Request/confirmation/role change is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Firebase sign-in missing, invalid or revoked; no quota consumed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Current entitlement denied, disabled account or deletion fence; no quota granted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Only enforce mode blocks; wait before an explicit retry, do not log the user out
      headers:
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1, maximum: 3600 }
        Cache-Control:
          required: true
          schema: { const: 'private, no-store' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RateLimitError' }
    Unavailable:
      description: Safe generic infrastructure/configuration failure; not an unlimited quota fallback
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
